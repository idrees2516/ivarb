[package]
name = "ivarb-frontend"
version.workspace = true
edition.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
ivarb-protocol = { path = "../crates/protocol" }
ivarb-quant = { path = "../crates/quant" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
    "Event",
    "Window",
    "Location",
    "Request",
    "RequestInit",
    "Headers",
    "Response",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
] }
