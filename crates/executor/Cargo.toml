[package]
name = "ivarb-executor"
version.workspace = true
edition.workspace = true

[dependencies]
ivarb-protocol = { path = "../protocol" }
ivarb-quant = { path = "../quant" }
ivarb-engine = { path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
tracing = "0.1"
anyhow = "1"
rand = "0.8"
# --- live protocol gateways ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "http2"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }
